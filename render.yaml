databases:
  - name: oneiroscope-postgres
    plan: free

services:
  - type: redis
    name: oneiroscope-redis
    plan: free
    ipAllowList: []

  - type: web
    name: oneiroscope-backend
    env: python
    plan: free
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    # Apply migrations before serving. Until now nothing ran alembic on deploy,
    # so the schema existed only where the dev-only `init_db()` had run — which
    # is why production had no `users` table and every natal chart 500'd. The
    # chain starts from an idempotent baseline, so this is a no-op against the
    # database as it stands today and provisions a fresh one from nothing.
    # Prefixed onto startCommand rather than `preDeployCommand`, which Render
    # offers only on paid instance types and this service is on `free`.
    # `&&`: a failed migration must stop the boot, not serve on a schema nobody
    # verified — serving on an unverified schema is exactly what produced the
    # UndefinedTable outage.
    startCommand: alembic -c backend/alembic.ini upgrade head && uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

      - key: ENVIRONMENT
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: oneiroscope-postgres
          property: connectionString
      - key: DATABASE_URL_SYNC
        fromDatabase:
          name: oneiroscope-postgres
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: redis
          name: oneiroscope-redis
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      # Frontend now lives on Vercel (see docs/deploy/vercel-frontend.md).
      # Given a VALUE, not `sync: false`. As a dashboard-only variable this was
      # simply never set, so the default (localhost) applied in production and
      # every browser call from the Vercel site was blocked by CORS — invisible
      # server-side, since the requests were served normally and only the
      # missing Access-Control-Allow-Origin header made them unusable.
      # Comma-separated, WITH scheme. Add custom domains here, in the blueprint,
      # so the deployed config stays reproducible from the repo.
      - key: ALLOWED_ORIGINS
        value: https://oneiroscope.vercel.app
      # Vercel gives every preview deploy its own hostname, which cannot be
      # enumerated ahead of time. Anchored to this project's own previews:
      # `oneiroscope-<hash>-<team>.vercel.app`. Left to the dashboard because
      # the team slug is account-specific — and because this API answers with
      # credentials, so widening it is a decision, not a default.
      - key: ALLOWED_ORIGIN_REGEX
        sync: false

      # Accounts that operate this deployment — comma-separated emails and/or
      # OAuth subjects. They resolve to the PRO tier so the people who ship the
      # paid paths can exercise them; without this the free tier's one-chart-
      # for-life grant applies to the owner exactly as to a customer, and the
      # paid path becomes untestable in production. Dashboard-only: it names
      # real people, and it belongs to the deployment rather than to the repo.
      - key: STAFF_ACCOUNTS
        sync: false

      - key: LUNAR_DEFAULT_TZ
        value: Europe/Moscow

      - key: GEONAMES_USERNAME
        sync: false

      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TOGETHER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

      # --- Remote MCP connector (docs/deploy/mcp-connector.md) -------------
      # Serves the MCP server at <backend>/mcp so Claude / ChatGPT / Gemini
      # can add this deployment as a connector.
      - key: MCP_ENABLED
        value: "true"
      - key: MCP_REQUIRE_AUTH
        value: "true"
      # Canonical resource id + OAuth audience. Set to this service's public
      # URL + /mcp once the service has a hostname. Also supplies the Host
      # allow-list for the transport's DNS-rebinding check — without it every
      # request would be 421 (see docs/deploy/mcp-connector.md).
      - key: MCP_PUBLIC_URL
        sync: false
      # Extra Host header values (custom domain), comma-separated. Optional.
      - key: MCP_ALLOWED_HOSTS
        sync: false
      # External authorization server (any IdP with Dynamic Client
      # Registration). Without it the MCP surface refuses to mount in
      # production rather than exposing tools unauthenticated.
      - key: MCP_AUTH_ISSUER
        sync: false
      - key: MCP_AUTH_AUDIENCE
        sync: false
      - key: MCP_REQUIRED_SCOPES
        sync: false

  # NOTE: the frontend was moved off Render to Vercel — its env vars (all the
  # *_API_URL values pointing to THIS backend's public URL) now live in the
  # Vercel project settings. See docs/deploy/vercel-frontend.md and
  # frontend/.env.example. Render hosts backend + Postgres + Redis only.
