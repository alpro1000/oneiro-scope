databases:
  - name: oneiroscope-postgres
    plan: free

services:
  - type: redis
    name: oneiroscope-redis
    plan: free
    ipAllowList: []

  - type: web
    name: oneiroscope-backend
    env: python
    plan: free
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

      - key: ENVIRONMENT
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: oneiroscope-postgres
          property: connectionString
      - key: DATABASE_URL_SYNC
        fromDatabase:
          name: oneiroscope-postgres
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: redis
          name: oneiroscope-redis
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      # Frontend now lives on Vercel (see docs/deploy/vercel-frontend.md).
      # Set this in the Render dashboard to your Vercel URL(s), comma-separated
      # and WITH scheme, e.g. https://oneiroscope.vercel.app,https://www.oneiroscope.com
      - key: ALLOWED_ORIGINS
        sync: false

      - key: LUNAR_DEFAULT_TZ
        value: Europe/Moscow

      - key: GEONAMES_USERNAME
        sync: false

      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TOGETHER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  # NOTE: the frontend was moved off Render to Vercel — its env vars (all the
  # *_API_URL values pointing to THIS backend's public URL) now live in the
  # Vercel project settings. See docs/deploy/vercel-frontend.md and
  # frontend/.env.example. Render hosts backend + Postgres + Redis only.
