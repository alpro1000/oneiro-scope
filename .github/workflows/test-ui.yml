name: UI Tests

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/test-ui.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/test-ui.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Smoke test lunar API
        run: |
          npm run dev -- --hostname 0.0.0.0 --port 3000 > .next-dev.log 2>&1 &
          NEXT_PID=$!
          cleanup() {
            kill $NEXT_PID 2>/dev/null || true
            wait $NEXT_PID 2>/dev/null || true
          }
          trap cleanup EXIT

          # Wait for the Next server to accept connections, then capture the HTTP
          # status. We deliberately do NOT use `curl -f`: a 502 is the CORRECT,
          # honest response when no ephemeris backend is reachable (conventions
          # §12 — no silent mock fallback), and CI runs no backend. This smoke
          # test verifies the /api/lunar route responds and that its body is
          # shaped correctly for whichever branch it legitimately takes:
          #   200 -> a real lunar payload (backend reachable)
          #   502 -> an honest error payload (backend unavailable)
          CODE=""
          for i in {1..30}; do
            CODE=$(curl -s -o /tmp/lunar.json -w "%{http_code}" http://localhost:3000/api/lunar || true)
            if [ -n "$CODE" ] && [ "$CODE" != "000" ]; then
              break
            fi
            sleep 2
          done

          echo "GET /api/lunar -> HTTP $CODE"
          cat /tmp/lunar.json || true
          echo

          if [ "$CODE" = "200" ]; then
            echo "Backend reachable — validating lunar payload"
            node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/lunar.json','utf8'));if(!d.date||!d.phase||typeof d.illumination==='undefined'){throw new Error('Invalid lunar payload: '+JSON.stringify(d));}console.log('valid lunar payload',d);"
          elif [ "$CODE" = "502" ]; then
            echo "No ephemeris backend in CI — /api/lunar honestly reports 502 (conventions §12, no mock fallback). OK."
            node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/lunar.json','utf8'));if(!d.error){throw new Error('502 without an honest error field: '+JSON.stringify(d));}console.log('honest 502 error payload',d);"
          else
            echo "Unexpected response from /api/lunar (HTTP $CODE)"
            cat .next-dev.log || true
            exit 1
          fi

      - name: Run E2E tests
        env:
          CI: 'true'
        run: npm run e2e
