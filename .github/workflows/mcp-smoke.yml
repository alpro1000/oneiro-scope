name: MCP Smoke

on:
  push:
    paths:
      - 'backend/mcp/**'
      - 'backend/services/**'
      - 'agents/**'
      - 'backend/tests/test_mcp_smoke.py'
      - 'backend/tests/test_agent_smoke.py'
      - 'backend/requirements.txt'
      - '.github/workflows/mcp-smoke.yml'
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest

    # A real Postgres for the chart-gate tests. The gate is the paywall and it
    # is the one place that touches the ORM on the request path; two outages
    # (missing `users` table, then `greenlet_spawn` from a lazy relationship
    # load) both slipped through because the existing gate tests use
    # SimpleNamespace fakes — no table, no session, nothing to fail. Postgres
    # specifically, not SQLite: `User.id` is `dialects.postgresql.UUID`, which
    # SQLite cannot even render.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oneiro
          POSTGRES_PASSWORD: oneiro
          POSTGRES_DB: oneiro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oneiro -d oneiro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://oneiro:oneiro@localhost:5432/oneiro_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-mcp-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-mcp-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install only what the smoke tests need — full backend requirements
          # bring heavy deps (mne, pandas, openai-whisper, sentry, etc.) that
          # aren't required for MCP/agent imports or pure-tool tests, and
          # slow CI install dramatically.
          pip install \
            "mcp[cli]>=1.2" \
            "claude-agent-sdk>=0.2" \
            "pydantic>=2.7,<3" \
            "pydantic-settings>=2.1" \
            pyswisseph \
            geopy \
            timezonefinder \
            pytz \
            ephem \
            fastapi \
            "pytest>=7" \
            "pytest-asyncio>=0.23" \
            cryptography \
            "email-validator>=2" \
            "python-jose[cryptography]>=3.3" \
            "jinja2>=3.1" \
            "sqlalchemy>=2" \
            "passlib>=1.7" \
            "python-multipart>=0.0.9" \
            redis \
            httpx \
            uvicorn \
            aiosqlite \
            asyncpg \
            psycopg2-binary \
            "alembic==1.13.1" \
            "pymorphy3>=2.0" \
            pymorphy3-dicts-ru
          # The block above is deliberately not requirements.txt — these are the
          # small pure-python pieces `backend.app.main` needs to import, so the
          # connector tests exercise the real app. The heavy ones (mediapipe,
          # spacy, torch) stay out; the code that needs them imports lazily.

      - name: Run MCP + agent smoke tests
        run: |
          python -m pytest \
            backend/tests/test_mcp_smoke.py \
            backend/tests/test_agent_smoke.py \
            backend/tests/test_specialist_agents.py \
            backend/tests/test_orchestrator.py \
            backend/tests/test_cost_tracker.py \
            backend/tests/test_llm_providers_cloud.py \
            backend/tests/test_byok.py \
            backend/tests/test_quotas.py \
            backend/tests/test_lemon_provider.py \
            backend/tests/test_email_templates.py \
            backend/tests/test_strategic_layers.py \
            backend/tests/test_strategic_astro_tools.py \
            backend/tests/test_strategic_agent.py \
            backend/tests/test_archetypes.py \
            backend/tests/test_disclaimer_and_numeric_confidence.py \
            backend/tests/test_dream_morphology.py \
            backend/tests/test_dream_interpreter_narrative.py \
            backend/tests/test_hvdc_golden.py \
            backend/tests/test_dream_series.py \
            backend/tests/test_mcp_remote_auth.py \
            backend/tests/test_portal.py \
            backend/tests/test_portal_account.py \
            backend/tests/test_connector_diagnostics.py \
            backend/tests/test_astrology_fallback_template.py \
            backend/tests/test_rate_limit_middleware.py \
            backend/tests/test_analysis_plan.py \
            backend/tests/test_strategic_patterns.py \
            backend/tests/test_capability_menu.py \
            backend/tests/test_chart_gate.py \
            backend/tests/test_chart_gate_postgres.py \
            backend/tests/test_migrations_postgres.py \
            backend/tests/test_mcp_apps.py \
            backend/tests/test_view_payload_contract.py \
            backend/tests/test_cors.py \
            backend/tests/test_staff_accounts.py \
            backend/tests/test_confidence_ladder_docs.py \
            backend/tests/test_mcp_moderation.py \
            backend/tests/test_tz_provenance.py \
            backend/tests/test_funnel_metrics.py \
            backend/tests/test_health_commit.py \
            backend/tests/test_rule_source_tier.py \
            -v
