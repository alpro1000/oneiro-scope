name: MCP Smoke

on:
  push:
    paths:
      - 'backend/mcp/**'
      - 'backend/services/**'
      - 'agents/**'
      - 'backend/tests/test_mcp_smoke.py'
      - 'backend/tests/test_agent_smoke.py'
      - 'backend/requirements.txt'
      - '.github/workflows/mcp-smoke.yml'
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-mcp-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-mcp-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install only what the smoke tests need — full backend requirements
          # bring heavy deps (mne, pandas, openai-whisper, sentry, etc.) that
          # aren't required for MCP/agent imports or pure-tool tests, and
          # slow CI install dramatically.
          pip install \
            "mcp[cli]>=1.2" \
            "claude-agent-sdk>=0.2" \
            "pydantic>=2.7,<3" \
            "pydantic-settings>=2.1" \
            pyswisseph \
            geopy \
            timezonefinder \
            pytz \
            ephem \
            fastapi \
            "pytest>=7" \
            "pytest-asyncio>=0.23" \
            cryptography \
            "email-validator>=2" \
            "python-jose[cryptography]>=3.3" \
            "jinja2>=3.1" \
            "sqlalchemy>=2" \
            "passlib>=1.7" \
            "python-multipart>=0.0.9" \
            redis \
            httpx \
            uvicorn \
            aiosqlite
          # The block above is deliberately not requirements.txt — these are the
          # small pure-python pieces `backend.app.main` needs to import, so the
          # connector tests exercise the real app. The heavy ones (mediapipe,
          # spacy, torch) stay out; the code that needs them imports lazily.

      - name: Run MCP + agent smoke tests
        run: |
          python -m pytest \
            backend/tests/test_mcp_smoke.py \
            backend/tests/test_agent_smoke.py \
            backend/tests/test_specialist_agents.py \
            backend/tests/test_orchestrator.py \
            backend/tests/test_cost_tracker.py \
            backend/tests/test_llm_providers_cloud.py \
            backend/tests/test_byok.py \
            backend/tests/test_quotas.py \
            backend/tests/test_lemon_provider.py \
            backend/tests/test_email_templates.py \
            backend/tests/test_strategic_layers.py \
            backend/tests/test_strategic_astro_tools.py \
            backend/tests/test_strategic_agent.py \
            backend/tests/test_archetypes.py \
            backend/tests/test_disclaimer_and_numeric_confidence.py \
            backend/tests/test_dream_morphology.py \
            backend/tests/test_dream_interpreter_narrative.py \
            backend/tests/test_hvdc_golden.py \
            backend/tests/test_dream_series.py \
            backend/tests/test_mcp_remote_auth.py \
            backend/tests/test_portal.py \
            backend/tests/test_portal_account.py \
            backend/tests/test_connector_diagnostics.py \
            backend/tests/test_astrology_fallback_template.py \
            backend/tests/test_rate_limit_middleware.py \
            backend/tests/test_analysis_plan.py \
            backend/tests/test_strategic_patterns.py \
            backend/tests/test_capability_menu.py \
            -v
