<!doctype html>
<html lang="{{ locale }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ app_name }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ tagline }}{% endblock %}">
<style>
  :root {
    --bg: #fbfbfd; --fg: #1b2a4a; --muted: #5a6070; --line: #d9dce4;
    --accent: #7a5c2e; --card: #fff; --code-bg: #f2f3f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12141a; --fg: #e8eaf0; --muted: #9aa1b1; --line: #2b2f3a;
      --accent: #d7b273; --card: #191c24; --code-bg: #1e222b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; }
  header { border-bottom: 1px solid var(--line); padding: 18px 0; }
  header .wrap { display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap; }
  .brand { font-weight: 700; font-size: 18px; text-decoration: none; color: var(--fg); }
  nav a { color: var(--muted); text-decoration: none; font-size: 14px; margin-right: 14px; }
  nav a:hover { color: var(--fg); }
  main { padding: 32px 0 56px; }
  h1 { font-size: 30px; line-height: 1.25; margin: 0 0 8px; }
  h2 { font-size: 20px; margin: 32px 0 10px; }
  h3 { font-size: 16px; margin: 22px 0 6px; }
  .lede { font-size: 18px; color: var(--muted); margin: 0 0 24px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px 18px; margin: 14px 0;
  }
  code, pre { background: var(--code-bg); border-radius: 6px; font-size: 13px; }
  code { padding: 2px 5px; }
  pre { padding: 12px 14px; overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; display: block; overflow-x: auto; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; }
  ol, ul { padding-left: 20px; }
  li { margin: 5px 0; }
  .muted { color: var(--muted); font-size: 14px; }
  .pill {
    display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted); margin-right: 6px;
  }
  footer { border-top: 1px solid var(--line); padding: 20px 0 40px; color: var(--muted); font-size: 13px; }
  footer a { color: var(--muted); }
  .disclaimer { font-size: 13px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 12px; }
</style>
</head>
<body>
<header><div class="wrap">
  <a class="brand" href="/">{{ app_name }}</a>
  <nav>
    <a href="/connect">{{ t.nav_connect }}</a>
    <a href="/pricing">{{ t.nav_pricing }}</a>
    <a href="/privacy">{{ t.nav_privacy }}</a>
    <a href="/account">{{ t.nav_account }}</a>
  </nav>
</div></header>
<main><div class="wrap">{% block content %}{% endblock %}</div></main>
<footer><div class="wrap">
  <p class="disclaimer">{{ disclaimer }}</p>
  <p>
    © {{ app_name }} ·
    <a href="/privacy">{{ t.nav_privacy }}</a> ·
    <a href="/terms">{{ t.nav_terms }}</a> ·
    <a href="/connect">{{ t.nav_connect }}</a>
  </p>
</div></footer>
</body>
</html>
